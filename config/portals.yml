    researched: false
    loginUrl: "https://www.autopase.cl/"
    rutFormat: combined
    fileFormat: xlsx
    selectors:
      rut: "input[name='rut']"            # TODO verify
      password: "input[type='password']"  # TODO verify
      submit: "button[type='submit']"     # TODO verify
      loginError: ".error, .alert-danger" # TODO verify
    notes: >
      NEEDS RESEARCH. Autopase covers Autopista Central and Ruta 78 / Autopista
      del Sol under one operator. Confirm whether one login exposes both.

  - id: ruta-78-autopista-del-sol

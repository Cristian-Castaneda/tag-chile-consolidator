# ════════════════════════════════════════════════════════════════════════════
# portals.yml — definition of every Chilean TAG autopista portal.
#
# The scraper reads this at runtime. Adding a new portal = a new entry here,
# no source changes required.
#
# Field reference
# ───────────────
#   id            Stable kebab-case identifier (used in logs / config refs).
#   name          Human-readable autopista name → becomes the Google Sheet tab.
#   concesionaria Operating company.
#   scraper       Which scraper module in src/scrapers/ handles this portal.
#                 Several autopistas can share one scraper (and one login) when
#                 they share a concesionaria portal — the orchestrator logs in
#                 once per scraper and tags the resulting rows per-autopista.
#   enabled       false → skipped entirely.
#   loginUrl      Page where the RUT + password form lives.
#   rutFormat     "split"    → RUT body and verifier digit go in separate fields
#                 "combined" → single field, e.g. "12345678-9"
#   fileFormat    Expected download format: xlsx | csv | pdf
#   selectors     CSS selectors for the login form. Tried first via Playwright;
#                 if a selector misses, the LLM navigation layer takes a
#                 screenshot and asks Claude for the right element.
#   notes         Human notes — quirks, captcha behavior, shared logins, etc.
#   researched    true  → login flow verified against the live site
#                 false → scaffolded best-effort, NEEDS verification
# ════════════════════════════════════════════════════════════════════════════

defaults:
  rutFormat: combined
  fileFormat: xlsx
  timeoutMs: 45000
  llmFallback: true

portals:
  # ──────────────────────────────────────────────────────────────────────────
  # COPSA — Costanera Norte & Autopista Nororiente (AVO)
  # One login at web.costaneranorte.cl covers both.
  # ──────────────────────────────────────────────────────────────────────────
  - id: costanera-norte
    name: "Costanera Norte"
    concesionaria: "COPSA"
    scraper: costaneranorte
    enabled: true
    researched: true
    loginUrl: "https://www.costaneranorte.cl/sucursal_virtual/login.html"
    rutFormat: split
    fileFormat: pdf
    selectors:
      rut: "#RUT"          # RUT body, max 8 digits, NO dots, NO verifier
      rutDv: "#RUTDV"      # verifier digit only (0-9 or K)
      password: "#PASSWORD"
      submit: "a#send"     # <a href="javascript:sendPOST()">Ingresar</a>
      loginError: "#mensaje"
    backend:
      # Legacy Delphi `convenios.dll` ISAPI app — server-rendered, cookie session.
      loginAction: "https://www.costaneranorte.cl/convenios.dll/dologin"
    notes: >
      Cloudflare Turnstile is ADAPTIVE: the form only forces a captcha when
      localStorage "loginCaptchaRequired" == "1" (set after failed/suspicious
      attempts). A fresh automated login normally submits with no captcha.
      Boletas download as PDF; the transit detail ("tránsitos no facturados")
      view may offer a tabular export — verify and prefer it over PDF parsing.
      Same login/account also exposes Autopista Nororiente (AVO) transits.

  - id: autopista-nororiente
    name: "Autopista Nororiente (AVO)"
    concesionaria: "COPSA"
    scraper: costaneranorte
    enabled: true
    researched: true
    loginUrl: "https://www.costaneranorte.cl/sucursal_virtual/login.html"
    rutFormat: split
    fileFormat: pdf
    selectors:
      rut: "#RUT"
      rutDv: "#RUTDV"
      password: "#PASSWORD"
      submit: "a#send"
      loginError: "#mensaje"
    notes: >
      Shares the COPSA portal and login with Costanera Norte. The costaneranorte
      scraper runs once and splits rows between the two autopistas by portico.

  # ──────────────────────────────────────────────────────────────────────────
